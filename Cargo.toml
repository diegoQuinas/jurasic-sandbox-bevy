[package]
name = "jurasic-sandbox-bevy"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["debug"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
noise = "0.9"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

# Bevy system params (`Res`, `Query`, …) are taken by value by design.
needless_pass_by_value = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

# Grid / TUI math is wrapping integer arithmetic, casts, and cell indexing.
as_conversions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
arithmetic_side_effects = "allow"
indexing_slicing = "allow"

# Deny panics
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
